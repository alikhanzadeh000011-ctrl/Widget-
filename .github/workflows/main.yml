name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip newest project zip
        run: |
          latest=$(ls *.zip | sort -V | tail -n 1)
          echo "Using $latest"
          unzip -oq "$latest"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
        working-directory: MediaWidget
      - uses: actions/upload-artifact@v4
        with:
          name: media-widget-apk
          path: MediaWidget/app/build/outputs/apk/debug/app-debug.apk
