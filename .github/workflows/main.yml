name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -oq ./*.zip
      - name: Fix MainActivity
        run: |
          sed -i 's/val text = TextView/val message = TextView/; s/addView(text)/addView(message)/' MediaWidget/app/src/main/java/com/example/mediawidget/MainActivity.kt
      - name: Fix widget layout
        run: |
          sed -i 's/<View$/<ImageView/; s/android:background="@drawable\/widget_scrim"/android:src="@drawable\/widget_scrim" android:scaleType="fitXY"/' MediaWidget/app/src/main/res/layout/widget_media.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
        working-directory: MediaWidget
      - uses: actions/upload-artifact@v4
        with:
          name: media-widget-apk
          path: MediaWidget/app/build/outputs/apk/debug/app-debug.apk
